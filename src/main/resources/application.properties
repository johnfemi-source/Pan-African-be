spring.application.name=pan-african-backend
server.port=${PORT:8081}

spring.profiles.active=dev
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pan_african?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:pan_african}
spring.datasource.password=${DB_PASSWORD:pan_african_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}